apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "configarr.fullname" . }}-repos
  labels:
    {{- include "configarr.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.cache.size }}
  {{- with .Values.cache.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
