{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.secretStoreRef.name }}
{{- fail "externalSecret.enabled requires externalSecret.secretStoreRef.name" }}
{{- end }}
{{- if not .Values.externalSecret.data }}
{{- fail "externalSecret.enabled requires externalSecret.data" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "configarr.fullname" . }}-prowlarr-api
  labels:
    {{- include "configarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.prowlarr.apiKeySecretRef.name }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
