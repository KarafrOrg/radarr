
image:
  repository: ghcr.io/raydak-labs/configarr
  pullPolicy: IfNotPresent
  tag: "1.39.0"

schedule: "0 * * * *"

prowlarr:
  url: http://radarr-prowlarr-svc:9696
  apiKeySecretRef:
    name: prowlarr-api-key
    key: PROWLARR_API_KEY

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  data: []

envFrom: []

cache:
  storageClassName: ""
  size: 1Gi

resources: {}

config: |-
  prowlarr:
    main:
      base_url: __PROWLARR_URL__
      api_key: !env PROWLARR_API_KEY

      indexers:
        data:
          - name: Internet Archive
            definition: internetarchive
            enable: true
            priority: 1
            sync_profile: Standard

        delete_unmanaged:
          enabled: false

      applications:
        data: []

      sync_profiles:
        data:
          - name: Standard
            enable_rss: true
            enable_automatic_search: true
            enable_interactive_search: true
            minimum_seeders: 1

        delete_unmanaged:
          enabled: false
