image:
  repository: ghcr.io/raydak-labs/configarr
  pullPolicy: IfNotPresent
  tag: "1.39.0"

schedule: "0 * * * *"

prowlarr:
  url: http://radarr-prowlarr-svc:9696
  apiKeySecretRef:
    name: prowlarr-api-key
    key: PROWLARR_API_KEY

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  data: [ ]

envFrom: [ ]

cache:
  storageClassName: ""
  size: 1Gi

resources: { }

config: |-
  config: |-
  prowlarr:
    main:
      base_url: http://radarr-prowlarr-svc:9696
      api_key: !env PROWLARR_API_KEY

      indexers:
        data:
          - name: TorrentsCSV
            definition: torrentscsv
            enable: true
            priority: 1
            sync_profile: Standard

          - name: LinuxTracker
            definition: linuxtracker
            enable: true
            priority: 2
            sync_profile: Standard

          - name: Nyaa.si
            definition: nyaasi
            enable: true
            priority: 3
            sync_profile: Standard

        delete_unmanaged:
          enabled: false

      applications:
        data: []

      sync_profiles:
        data:
          - name: Standard
            enable_rss: true
            enable_automatic_search: true
            enable_interactive_search: true
            minimum_seeders: 1

        delete_unmanaged:
          enabled: false