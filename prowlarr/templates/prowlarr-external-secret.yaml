{{- if .Values.auth.enabled }}
{{- range $k := list "clientIdRemoteRef" "clientSecretRemoteRef" "cookieSecretRemoteRef" }}
{{- if not (index $.Values.auth.externalSecret $k) }}
{{- fail (printf "sso.enabled requires sso.externalSecret.%s" $k) }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.apiKeySecretRef.name }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.auth.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.auth.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.auth.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: ${{ .Values.auth.apiKeySecretRef.key }}
      remoteRef:
        key: {{ .Values.auth.externalSecret.prowlarrApiKeyRemoteRef }}
{{- end }}
