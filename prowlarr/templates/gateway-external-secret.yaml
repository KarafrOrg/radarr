{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.externalSecret.enabled }}
{{- if not .Values.gateway.externalSecret.secretStoreRef.name }}
{{- fail "gateway.externalSecret.enabled requires gateway.externalSecret.secretStoreRef.name" }}
{{- end }}
{{- if not .Values.gateway.externalSecret.accountIdRemoteRef }}
{{- fail "gateway.externalSecret.enabled requires gateway.externalSecret.accountIdRemoteRef" }}
{{- end }}
{{- if not .Values.gateway.externalSecret.apiTokenRemoteRef }}
{{- fail "gateway.externalSecret.enabled requires gateway.externalSecret.apiTokenRemoteRef" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gateway.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.gateway.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.gateway.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.gateway.credentialsSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: {{ .Values.gateway.externalSecret.accountIdRemoteRef }}
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: {{ .Values.gateway.externalSecret.apiTokenRemoteRef }}
{{- end }}
{{- end }}
