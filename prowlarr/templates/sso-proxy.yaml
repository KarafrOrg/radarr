{{- if .Values.sso.enabled }}
{{- $name := printf "%s-oauth2-proxy" (include "prowlarr.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.sso.image.repository }}:{{ .Values.sso.image.tag }}"
          args:
            - --provider=github
            - --http-address=0.0.0.0:4180
            - --upstream=http://{{ include "prowlarr.fullname" . }}-svc:{{ .Values.service.port }}
            - --redirect-url=https://{{ .Values.route.hostname }}/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --reverse-proxy=true
            - --skip-provider-button=true
            {{- with .Values.sso.github.org }}
            - --github-org={{ . }}
            {{- end }}
            {{- with .Values.sso.github.team }}
            - --github-team={{ . }}
            {{- end }}
            {{- range .Values.sso.github.users }}
            - --github-user={{ . }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.sso.secretName }}
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.sso.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 4180
      targetPort: http
{{- end }}
