{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "prowlarr.fullname" . }}-public-route
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.gateway.enabled }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ default (include "prowlarr.fullname" .) .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
    {{- else }}
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
    {{- end }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "prowlarr.fullname" . }}-svc
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
