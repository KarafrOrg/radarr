
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowlarr.fullname" . }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prowlarr.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "prowlarr.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: init-config
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          # language=sh
          command:
            - sh
            - -ec
            - |
              CONFIG_FILE="/config/config.xml"

              if [ ! -f "${CONFIG_FILE}" ]; then
                echo "Initializing Prowlarr configuration..."
                cp /config-template/config.xml "${CONFIG_FILE}"
              fi

              if [ -z "${PROWLARR_API_KEY:-}" ]; then
                echo "ERROR: PROWLARR_API_KEY is empty"
                exit 1
              fi

              sed -i \
              "s|</Config>|  <ApiKey>${PROWLARR_API_KEY}</ApiKey>\n</Config>|" \
              "${CONFIG_FILE}"

              echo "Prowlarr configuration initialized."
          env:
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.apiKeySecretRef.name }}
                  key: {{ .Values.auth.apiKeySecretRef.key }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-template
              mountPath: /config-template/config.xml
              subPath: config.xml
              readOnly: true

      containers:
        - name: prowlarr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.sso.enabled }}
            - name: PROWLARR__AUTH__METHOD
              value: External
            {{- end }}
            {{- with .Values.auth.apiKeySecretRef.name }}
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.auth.apiKeySecretRef.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config

      volumes:
        - name: config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-config" (include "prowlarr.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}

        - name: config-template
          configMap:
            name: {{ include "prowlarr.fullname" . }}-config
