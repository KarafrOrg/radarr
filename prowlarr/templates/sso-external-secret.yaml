{{- if .Values.sso.enabled }}
{{- range $k := list "clientIdRemoteRef" "clientSecretRemoteRef" "cookieSecretRemoteRef" }}
{{- if not (index $.Values.sso.externalSecret $k) }}
{{- fail (printf "sso.enabled requires sso.externalSecret.%s" $k) }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.sso.secretName }}
  labels:
    {{- include "prowlarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.sso.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.sso.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.sso.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: {{ .Values.sso.externalSecret.clientIdRemoteRef }}
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.sso.externalSecret.clientSecretRemoteRef }}
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: {{ .Values.sso.externalSecret.cookieSecretRemoteRef }}
{{- end }}
