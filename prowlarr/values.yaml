replicaCount: 1

image:
  repository: lscr.io/linuxserver/prowlarr
  pullPolicy: IfNotPresent
  tag: latest

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC

auth:
  apiKeySecretRef:
    name: ""
    key: PROWLARR_API_KEY

service:
  type: ClusterIP
  port: 9696

gateway:
  enabled: true
  name: ""
  className: cloudflare-tunnel
  credentialsSecretName: cloudflare-gateway-creds
  tunnel:
    replicas: []
  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-cluster-secret-store
      kind: ClusterSecretStore
    accountIdRemoteRef: cloudflare-account-id
    apiTokenRemoteRef: cloudflare-api-token

route:
  enabled: true
  hostname: prowlarr.karafra.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-ingress-gateway

persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources:
  limits:
    cpu: 100m
    memory: 500Mi
  requests:
    cpu: 50m
    memory: 64Mi

# GitHub SSO via oauth2-proxy in front of Prowlarr (Prowlarr has no native OIDC).
# Requires a GitHub OAuth app with callback https://<route.hostname>/oauth2/callback.
sso:
  enabled: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
  github:
    org: KarafrOrg
    team: prowlarr-admins
    users: []
  secretName: prowlarr-oauth2-proxy
  externalSecret:
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-cluster-secret-store
      kind: ClusterSecretStore
    clientIdRemoteRef: prowlarr-github-client-id
    clientSecretRemoteRef: prowlarr-github-client-secret
    cookieSecretRemoteRef: prowlarr-oauth-cookie-secret
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
