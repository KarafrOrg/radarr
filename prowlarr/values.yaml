replicaCount: 1

image:
  repository: lscr.io/linuxserver/prowlarr
  pullPolicy: IfNotPresent
  tag: latest

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC

service:
  type: ClusterIP
  port: 9696

route:
  enabled: true
  hostname: prowlarr.karafra.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-ingress-gateway
      namespace: infra-network

persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources:
  limits:
    cpu: 100m
    memory: 500Mi
  requests:
    cpu: 50m
    memory: 64Mi
